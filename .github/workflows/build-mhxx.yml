      - name: Checkout Folium (pinned)
        run: |
          git clone https://github.com/folium-app/Folium.git folium
          cd folium
          git checkout "$FOLIUM_COMMIT"
          git submodule update --init --recursive --depth 1

      - name: Apply MHXX patches
        run: |
          cd folium
          git apply --ignore-whitespace --whitespace=nowarn ../kit/patches/folium-mhxx.patch
          git -C Cytrus apply --whitespace=nowarn ../../kit/patches/cytrus-mhxx.patch
          git status --short
          git -C Cytrus status --short

      - name: Show Xcode version (runner default)
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          cd folium
          xcodebuild \
            -project Folium.xcodeproj \
            -scheme Folium \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | (grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true)

      - name: Package IPA
        run: |
          cd folium
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ../MHXX.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MHXX-ipa
          path: MHXX.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: folium/build.log
